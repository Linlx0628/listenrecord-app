name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议。把"你遇到的实际场景"讲清楚，比"希望加一个 XX 功能"更容易被采纳。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前是怎么绕过的
      description: 现在用什么方式替代？为什么不够好？
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: 主要使用的平台
      options:
        - macOS
        - Windows
        - Linux
        - Android
        - 多个平台
    validations:
      required: false
